name: dom-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright@1.47.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe chat.qwen.ai
        run: node tests/qwen-enter-to-send.probe.mjs
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: probe-out/
          if-no-files-found: warn
