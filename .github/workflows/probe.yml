name: probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Which probe to run
        required: true
        default: dom
        type: choice
        options:
          - dom
          - copy

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright@1.47.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run probe
        run: |
          if [ "${{ inputs.probe }}" = "copy" ]; then
            node tests/qwen-copy.probe.mjs
          else
            node tests/qwen-enter-to-send.probe.mjs
          fi
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ inputs.probe }}
          path: probe-out/
          if-no-files-found: warn
